name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / MariaDB 10.11
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sklad_test
          MARIADB_USER: sklad
          MARIADB_PASSWORD: sklad
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sklad_test
      DB_USERNAME: sklad
      DB_PASSWORD: sklad

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl, bcmath, gd, zip, ldap
          coverage: none

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
