; /etc/supervisor/conf.d/sklad-worker.conf — воркер очереди (QUEUE_CONNECTION=database)
# artisan — обёртка, которую создаёт deploy.sh (нужный PHP + текущий релиз).
[program:sklad-worker]
command=/var/www/sklad/data/app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=sklad
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/sklad/data/app/shared/storage/logs/worker.log
