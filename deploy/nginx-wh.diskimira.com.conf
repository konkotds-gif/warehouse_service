# nginx: wh.diskimira.com — платформа хранения колёс (Laravel 13, PHP 8.4)
# Отличия от стандартного конфига ispmanager помечены «# WH:».
#
# ПЕРЕД ПРАВКОЙ в ispmanager (Сайты → wh.diskimira.com):
#   1) Корневая директория: /var/www/1c8/data/www/wh.diskimira.com/current/public
#   2) Версия PHP: 8.4 (режим PHP-FPM) — ispmanager сам поменяет сокет в fastcgi_pass.
#      Сверьте номер сокета ниже (было 15.sock — это пул PHP 8.2) с тем, что он сгенерирует.
# ispmanager перезаписывает этот файл при сохранении настроек сайта — после изменений в панели
# сверьте конфиг ещё раз (или вынесите блоки «# WH:» в /etc/nginx/vhosts-resources/wh.diskimira.com/).

server {
	server_name wh.diskimira.com www.wh.diskimira.com;
	listen 192.168.1.113:80;
	# WH: весь HTTP сразу на https://wh.diskimira.com (без :443 и без www)
	return 301 https://wh.diskimira.com$request_uri;
}

server {
	server_name wh.diskimira.com www.wh.diskimira.com;
	listen 192.168.1.113:443 ssl;

	ssl_certificate "/var/www/httpd-cert/1c8/*.diskimira.com_custom_1.crtca";
	ssl_certificate_key "/var/www/httpd-cert/1c8/*.diskimira.com_custom_1.key";
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	# WH: TLS 1.0/1.1 убраны — устарели, PWA и современные браузеры их не используют
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

	if ($host = www.wh.diskimira.com) {
		return 301 https://wh.diskimira.com$request_uri;
	}

	charset utf-8;
	# WH: Laravel — только index.php
	index index.php;

	# WH: корень — public текущего релиза (current — симлинк на releases/<дата>)
	set $root_path /var/www/1c8/data/www/wh.diskimira.com/current/public;
	root $root_path;
	# симлинки current, storage и public/storage принадлежат 1c8 — проверка if_not_owner их пропускает
	disable_symlinks if_not_owner from=$root_path;

	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/wh.diskimira.com/*.conf;
	include /etc/nginx/users-resources/1c8/*.conf;
	access_log /var/www/httpd-logs/wh.diskimira.com.access.log;
	error_log /var/www/httpd-logs/wh.diskimira.com.error.log notice;

	# WH: фото комплектов до 20 МБ
	client_max_body_size 20m;

	# WH: базовые заголовки безопасности
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript application/manifest+json image/svg+xml;

	# WH: скрытые файлы (.env, .git и т.п.) — запрещены, кроме .well-known (Let's Encrypt)
	location ~ /\.(?!well-known/) {
		deny all;
	}

	# WH: сборка Vite — имена с хешем, кэш на год
	location ^~ /build/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options nosniff always;
		access_log off;
		try_files $uri =404;
	}

	# WH: service worker PWA и манифест — без кэша, иначе телефоны не получат обновление
	location = /sw.js {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}
	location = /manifest.webmanifest {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
	location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

	location / {
		# WH: PHP исполняется только через фронт-контроллер index.php
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @php;
		}
		location ~* ^.+\.(jpg|jpeg|gif|png|svg|ico|webp|woff2?|css|js)$ {
			expires 24h;
			access_log off;
			try_files $uri /index.php?$query_string;
		}
		# WH: красивые URL Laravel
		try_files $uri $uri/ /index.php?$query_string;
	}

	location @php {
		include /etc/nginx/vhosts-resources/wh.diskimira.com/dynamic/*.conf;
		fastcgi_index index.php;
		fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@wh.diskimira.com";
		# WH: сокет пула PHP 8.4 — номер подставит ispmanager после выбора версии 8.4 (15 — это 8.2!)
		fastcgi_pass unix:/var/www/php-fpm/15.sock;
		fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
		try_files $uri =404;
		include fastcgi_params;
		# WH: реальный путь релиза вместо симлинка current — после выкладки PHP сразу видит новый код
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		fastcgi_param DOCUMENT_ROOT $realpath_root;
		fastcgi_param HTTPS on;
		fastcgi_read_timeout 120s;
	}
}
