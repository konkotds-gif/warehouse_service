# Фрагмент для nginx (ispmanager: «Сайты» → конфиг). Корень — каталог public текущего релиза.
root /var/www/sklad/data/app/current/public;
index index.php;
client_max_body_size 20m;   # фото комплектов

location / { try_files $uri $uri/ /index.php?$query_string; }
location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }
